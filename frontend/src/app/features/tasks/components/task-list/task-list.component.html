<div class="task-list">
  @for (task of tasks(); track task.id) {
    <app-task-card
      [task]="task"
      (edit)="onEdit($event)"
      (remove)="onRemove($event)"
      (open)="onOpen($event)"
    />
  } @empty {
    <div class="task-list__empty">
      <h3>Nenhuma task encontrada</h3>
      <p>Quando novas tarefas forem criadas, elas aparecerão aqui.</p>
    </div>
  }
</div>
